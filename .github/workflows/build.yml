name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3

      - name: Build release APK
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk SX-CAR.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SX-CAR
          path: SX-CAR.apk

      - name: Publish APK on apk branch
        run: |
          git config user.name "sx-car-bot"
          git config user.email "bot@sxgang"
          git checkout --orphan apk
          git rm -rf --cached . -q
          git add -f SX-CAR.apk
          git commit -m "APK $(date -u +%F_%H%M)" -q
          git push -f origin apk
