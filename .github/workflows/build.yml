name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Android SDK
        run: |
          SDK=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDK --licenses > /dev/null 2>&1 || true
          $SDK "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Build release APK
        id: build
        continue-on-error: true
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Publicar log do build
        if: always()
        run: |
          git config user.name "sx-car-bot"
          git config user.email "bot@sxgang"
          git fetch origin log 2>/dev/null || true
          git checkout --orphan log
          git rm -rf --cached . -q
          grep -vE '^\s*$' build.log | tail -400 > build-tail.log
          git add -f build-tail.log
          git commit -m "log $(date -u +%F_%H%M) status=${{ steps.build.outcome }}" -q
          git push -f origin log
          test "${{ steps.build.outcome }}" = "success"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk SX-CAR.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SX-CAR
          path: SX-CAR.apk

      - name: Publish APK on apk branch
        run: |
          git config user.name "sx-car-bot"
          git config user.email "bot@sxgang"
          git checkout --orphan apk
          git rm -rf --cached . -q
          git add -f SX-CAR.apk
          git commit -m "APK $(date -u +%F_%H%M)" -q
          git push -f origin apk
